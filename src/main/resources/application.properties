#Thu Apr 23 21:16:16 CST 2026
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.url=jdbc\:postgresql\://${BANK_DB_HOST:127.0.0.1}\:${BANK_DB_PORT:5432}/${BANK_DB_NAME:bank_api}
datasources.default.username=${BANK_DB_USER:bank_user}
datasources.default.password=${BANK_DB_PASSWORD:bank_pass}
# Flyway es el único dueño del esquema: Micronaut Data no crea/borra tablas.
datasources.default.schema-generate=NONE
flyway.datasources.default.enabled=true
micronaut.application.name=bankaccount
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**
micronaut.router.static-resources.swagger-ui.paths=classpath\:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger.paths=classpath\:META-INF/swagger
micronaut.security.intercept-url-map[0].access=isAnonymous()
micronaut.security.intercept-url-map[0].pattern=/swagger/**
micronaut.security.intercept-url-map[1].access=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/swagger-ui/**

# spec-02: seguridad activa. /api/auth/** es publico via @PermitAll; el resto
# de endpoints (legacy /accounts) queda autenticado hasta la spec-03.
micronaut.security.enabled=true
# JWT HS256. JWT_SECRET debe tener >= 32 bytes (256 bits) en produccion; el
# valor por defecto es SOLO de desarrollo y debe sustituirse siempre.
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes}
micronaut.security.token.jwt.generator.access.expiration=3600

logger.levels.io.micronaut=DEBUG
logger.levels.io.onstructive=DEBUG